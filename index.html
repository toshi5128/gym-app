function saveDraft(){
  const sets=draftSets.filter(s=> s.r!=='' && (s.bw||s.w!=='')).map(s=>({w:(s.bw?Number(s.w||0):Number(s.w)),r:Number(s.r), ...(s.bw?{bw:true}:{}), ...(s.rir!=null?{rir:s.rir}:{})}));
  if(!sets.length){ toast(draftSets.some(s=>s.bw)?'メインセットの回数を入力してください':'メインセットの重量と回数を入力してください'); return; }
  const warm=draftWarm.filter(s=>s.w!==''&&s.r!=='').map(s=>({w:Number(s.w),r:Number(s.r)}));
  const lastRir=sets.length?sets[sets.length-1].rir:undefined;   // 互換: 種目代表のキツさ=最終セット
  // 既存記録の編集
  if(editId){
    const l=logs.find(x=>x.id===editId);
    if(l){ l.exId=draftExId; l.sets=sets; l.rtId=selRt; if(lastRir!=null)l.rir=lastRir; else delete l.rir; if(warm.length)l.warm=warm; else delete l.warm; }
    editId=null; saveAll(); toast('更新しました'); clearDraft(); renderLog(); return;
  }
  // 新規追加（対象日 workDate に記録）
  const before=bestBefore(draftExId);
  const tMaxW=Math.max(...sets.map(s=>setKg(s,workDate))); const tMax1=Math.max(...sets.map(s=>est1rm(setKg(s,workDate),s.r)));
  logs.push({id:uid(), date:workDate, exId:draftExId, sets, rtId:selRt, at:new Date().toISOString(), ...(lastRir!=null?{rir:lastRir}:{}), ...(warm.length?{warm}:{})});
  saveAll();
  // PR演出・タイマーは「今日」の記録のときだけ（過去日の振り返り入力では出さない）
  if(isToday() && before.maxW>0 && (tMaxW>before.maxW || tMax1>before.max1+0.01)){
    const what = tMaxW>before.maxW ? `最大重量 ${before.maxW} → ${tMaxW}kg` : `推定1RM ${Math.round(before.max1)} → ${Math.round(tMax1)}kg`;
    celebratePR(`${exName(draftExId)} ・ ${what}`);
  } else { toast('記録しました'); }
  if(isToday() && settings.autoTimer) Timer.start(restFor(draftExId));
  delete pendingDrafts[draftExId];   // 記録できたので「記録待ち」から外す
  clearDraft();
  const rt=rtObj(selRt); if(rt){ const nx=rt.exIds.find(id=>!doneTodayEx(id)); if(nx){ draftExId=nx; loadDraftFromPending(nx); } }
  renderLog();
}

function shiftMonth(ym,delta){ let [y,m]=ym.split('-').map(Number); m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return `${y}-${String(m).padStart(2,'0')}`; }
function buildCalendar(){
  const ym=calMonth||todayStr().slice(0,7); const [y,m]=ym.split('-').map(Number);
  const startDow=new Date(y,m-1,1).getDay(); const daysInMonth=new Date(y,m,0).getDate();
  const byDate={}; logs.forEach(l=>{ if(l.date.startsWith(ym)){ (byDate[l.date]=byDate[l.date]||new Set()); if(l.rtId&&rtObj(l.rtId))byDate[l.date].add(rtObj(l.rtId).name); } });
  const wk=['日','月','火','水','木','金','土'];
  let cells=''; for(let i=0;i<startDow;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){ const ds=`${ym}-${String(d).padStart(2,'0')}`; const parts=byDate[ds]?[...byDate[ds]]:[];
    const has=parts.length>0, mk=has?parts.map(p=>p[0]).join('').slice(0,3):'';
    cells+=`<div class="cal-cell ${has?'has':''} ${ds===todayStr()?'today':''} ${ds===histSelDate?'sel':''}" data-cd="${ds}"><span class="cal-d">${d}</span>${has?`<span class="cal-mk">${mk}</span>`:''}</div>`; }
  return `<div class="card cal-card">
    <div class="cal-head"><button class="cal-nav" data-cm="prev">‹</button>
      <div class="cal-title">${y}年${m}月<span class="cal-sub">${Object.keys(byDate).length}日 トレ</span></div>
      <button class="cal-nav" data-cm="next">›</button></div>
    <div class="cal-grid cal-wk">${wk.map(w=>`<div class="cal-w">${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div></div>`;
}

/* ============ スパークライン ============ */
function spark(vals){
  if(vals.length<2) return `<div class="spark-empty">データが2回分たまると推移グラフが出ます</div>`;
  const W=300,H=50,P=5, min=Math.min(...vals), max=Math.max(...vals), rng=max-min||1;
  const X=i=>P+i/(vals.length-1)*(W-2*P), Y=val=>H-P-(val-min)/rng*(H-2*P);
  const d=vals.map((val,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(val).toFixed(1)}`).join(' ');
  const area=`M${X(0).toFixed(1)} ${H} L`+vals.map((val,i)=>`${X(i).toFixed(1)} ${Y(val).toFixed(1)}`).join(' L')+` L${X(vals.length-1).toFixed(1)} ${H} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${area}" fill="url(#ag)" stroke="none"/>
    <path d="${d}" fill="none" stroke="#b0892f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(vals[vals.length-1]).toFixed(1)}" r="3" fill="#fff"/>
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(168,132,47,.28)"/><stop offset="1" stop-color="rgba(168,132,47,0)"/></linearGradient></defs></svg>`;
}

  const wkStarts=[]; for(let w=11;w>=0;w--) wkStarts.push(shiftWeek(_wkStart,-w));

  const avgWk=(totalDays/12).toFixed(1);
  const wkDenom=Math.max(3,...wkCounts);
  const wkBars=`<div class="wk-bars">${wkCounts.map((c,i)=>{ const cur=i===11; const parts=wkStarts[i].split('-'); const showLab=(i%3===0)||cur;
    const h=c?Math.max(5,Math.round(c/wkDenom*50)):3;
    return `<div class="wk-col ${cur?'cur':''} ${c?'':'wk-zero'}"><div class="wk-cnt">${c||''}</div><div class="wk-track"><div class="wk-fill" style="height:${h}px"></div></div><div class="wk-lab">${showLab?(+parts[1])+'/'+(+parts[2]):''}</div></div>`; }).join('')}</div>`;

  // 筋力スタンダード
  const PL3=[['bench','ベンチプレス'],['squat','スクワット'],['dead','デッドリフト']];
  const bwKg=cur?cur.kg:null; let stdHtml;
  if(!bwKg){ stdHtml=`<div class="hint" style="border:none;padding:0">下の「体重」を登録すると、体重比であなたのランクが出ます。</div>`; }
  else { const arrSex=STD[settings.sex]||STD.male;
    stdHtml=PL3.map(([id,nm])=>{ const e=exObj(id); if(!e)return ''; const best=bestE1rm(id);
      if(!best)return `<div class="std-row"><div class="std-top"><span style="font-weight:700">${nm}</span><span class="std-sub">記録なし</span></div></div>`;
      const arr=arrSex[id]; const ratio=best/bwKg; const lv=stdLevel(ratio,arr); const lvLabel=lv<0?'入門前':STD_LV[lv];
      let nextTxt; if(lv+1<arr.length){ const need=Math.max(0,Math.round(arr[lv+1]*bwKg-best)); nextTxt=`次の「${STD_LV[lv+1]}」まで あと${need}kg`; } else nextTxt='最高ランク到達！';
      return `<div class="std-row"><div class="std-top"><span style="font-weight:700">${nm}</span><span class="lv">${lvLabel}</span></div>
        <div class="std-sub">推定1RM ${Math.round(best)}kg ・ 体重比 ${ratio.toFixed(2)}倍 ・ ${nextTxt}</div>
        <div class="std-seg">${STD_LV.map((n,i)=>`<div class="seg ${i<=lv?'on':''}">${n}</div>`).join('')}</div></div>`; }).join(''); }

  // 詳細チャート — 2回以上記録した種目だけがグラフ化できる。まず部位→その中の種目、の2段（自己ベストと同じ）
  const graphable=perEx.filter(p=>p.trend.length>=2);   // 既にmax1降順（＝強い種目が先頭）
  let chartMuscles=Object.keys(VOL).filter(m=>graphable.some(p=>p.muscle===m));
  graphable.forEach(p=>{ if(!chartMuscles.includes(p.muscle)) chartMuscles.push(p.muscle); });
  if(!chartMuscle || !chartMuscles.includes(chartMuscle)) chartMuscle=chartMuscles[0]||null;
  const chartInMus=graphable.filter(p=>p.muscle===chartMuscle);
  if(!chartInMus.some(p=>p.id===chartExId)) chartExId=chartInMus[0]?.id||null;
  let chartPts=[]; if(chartExId){ const byD={}; logs.filter(l=>l.exId===chartExId).forEach(l=>{ const m=Math.max(...l.sets.map(s=>est1rm(setKg(s,l.date),s.r))); byD[l.date]=Math.max(byD[l.date]||0,m); });
    chartPts=Object.keys(byD).sort().map(d=>({d:d.slice(5).replace('-','/'),val:Math.round(byD[d])})); }
  const chartMusChips=chartMuscles.map(m=>`<span class="mchip ${m===chartMuscle?'on':''}" data-chartm="${m}">${m}</span>`).join('');
  const chartExChips=chartInMus.map(p=>`<span class="mchip ${p.id===chartExId?'on':''}" data-chart="${p.id}">${p.name}</span>`).join('');

  // 採寸
  const ms=measSeries(measSel); const mcur=ms[ms.length-1], mprev=ms[ms.length-2]; const measName=(MEAS_LIST.find(x=>x[0]===measSel)||['','部位'])[1];
  let mdelta=''; if(mcur&&mprev){ const dd=mcur.v-mprev.v; mdelta=`<span class="delta" style="color:${dd>0?'#6ad1a0':(dd<0?'#ff9a6a':'var(--txt-3)')}">${dd>0?'+':''}${dd.toFixed(1)}cm</span>`; }
  const measCard=`<div class="card"><div class="mchips">${MEAS_LIST.map(([k,n])=>`<span class="mchip ${k===measSel?'on':''}" data-meas="${k}">${n}</span>`).join('')}</div>
    <div class="bw-head"><div class="big">${mcur?mcur.v.toFixed(1):'--'}<small> cm</small></div>${mdelta}<span style="margin-left:auto;font-size:11px;color:var(--txt-3)">${mcur?fmtDate(mcur.date):''}</span></div>
    ${spark(ms.map(x=>x.v))}
    <div class="bw-input"><div class="field"><input id="measIn" type="number" inputmode="decimal" placeholder="${measName}（cm）" value=""><span class="unit">cm</span></div>
      <button class="btn primary" style="width:auto;padding:0 20px" id="measSave">記録</button></div></div>`;


  const summarySec=`<div class="eyebrow">サマリー</div>
    <div class="stat-grid">
      <div class="stat"><div class="v tnum">${days}<small> 日</small></div><div class="k">トレ日数</div></div>
      <div class="stat"><div class="v tnum">${(totalVol/1000).toFixed(1)}<small> t</small></div><div class="k">累計ボリューム</div></div>
      <div class="stat"><div class="v tnum">${st.cur}<small> 週</small></div><div class="k">連続トレ週</div></div>
      <div class="stat"><div class="v tnum">${st.wc}<small> 回</small></div><div class="k">今週のトレ</div></div>
    </div>`;

  const weekSec=`<div class="eyebrow">今週の動き</div>
    <div class="card wk-card">${(()=>{ const thisMon=weekRange().start, lastMon=weekStartOf(shiftDate(thisMon,-1));
      const tw=weekStats(thisMon), lw=weekStats(lastMon);
      const volPct=lw.vol>0?Math.round((tw.vol-lw.vol)/lw.vol*100):null;
      const volSub=volPct==null?(tw.vol>0?'今シーズン初':'まだ記録なし'):(volPct>=0?`先週比 +${volPct}%`:`先週比 ${volPct}%`);
      const volCls=volPct==null?'':(volPct>=0?'up':'down');
      const dCls=tw.days>=lw.days?'up':'down';
      return `<div class="wk-row"><span class="wk-k">トレ回数</span><span class="wk-v tnum">${tw.days}<small>回</small></span><span class="wk-sub ${dCls}">先週 ${lw.days}回</span></div>
        <div class="wk-row"><span class="wk-k">ボリューム</span><span class="wk-v tnum">${(tw.vol/1000).toFixed(1)}<small>t</small></span><span class="wk-sub ${volCls}">${volSub}</span></div>
        <div class="wk-row"><span class="wk-k">自己ベスト更新</span><span class="wk-v tnum"${prsThisWeek()>0?' style="color:var(--pos)"':''}>${prsThisWeek()}<small>回</small></span><span class="wk-sub${prsThisWeek()>0?' up':''}">今週</span></div>`; })()}</div>`;

  const prSec=`<div class="eyebrow">自己ベスト（PR）</div>
    ${perEx.length?prBoardHtml:'<div class="hint" style="border:none;padding:0 2px">記録をためると、種目ごとの<b>最高重量・推定1RM・最多回数</b>がここに並びます。</div>'}`;

  const curName=(graphable.find(p=>p.id===chartExId)||{}).name||'';
  const chartSec=`<div class="eyebrow">推移グラフ</div>
    <div class="card">
      ${graphable.length?`<div class="chart-lead"><b>部位</b>を選び、その中の<b>種目</b>を選ぶと、<b>推定1RM</b>（＝1回だけ全力で挙げられる重さの目安）がどう伸びてきたかを線で見られます。</div>
        <div class="mchips">${chartMusChips}</div>
        <div class="chart-sublabel">種目</div>
        <div class="mchips">${chartExChips}</div>
        <div class="chart-cur">${curName}</div>
        ${bigChart(chartPts)}`:`<div class="empty" style="padding:24px">${IC.stats.replace('<svg','<svg width=28 height=28')}同じ種目を2回以上記録すると、ここに伸びのグラフが出ます。</div>`}
    </div>`;

  const stdSec=`<div class="eyebrow">筋力レベル（あなたのランク）</div>
    <div class="card">${stdHtml}<div class="hint" style="margin-top:10px">体重比でBIG3の到達レベルを表示（${settings.sex==='female'?'女性':'男性'}基準・目安）。設定で性別を変更できます。</div></div>`;

  const calSec=`<div class="eyebrow">トレーニングの記録（直近12週）</div>
    <div class="card">
      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
        <div class="stat" style="padding:13px 10px"><div class="v tnum">${totalDays}<small> 日</small></div><div class="k">12週の合計</div></div>
        <div class="stat" style="padding:13px 10px"><div class="v tnum">${avgWk}<small> 回</small></div><div class="k">週の平均</div></div>
        <div class="stat" style="padding:13px 10px"><div class="v tnum">${st.cur}<small> 週</small></div><div class="k">連続中<br>最高${st.best}週</div></div>
      </div>
      ${wkBars}
      <div class="hint" style="margin-top:10px">棒1本＝1週間。高いほど、その週に<b>たくさんトレした</b>という意味です（数字＝その週のトレ日数）。いちばん右が今週。</div></div>`;

  const volSec=`<div class="eyebrow">今週のボリューム（部位別）</div>
    ${dh?`<div class="banner">${dh}</div>`:''}
    <div class="card">${volRows}
      <div class="hint" style="margin-top:4px">今週の<b>セット数</b>（${fmtDate(weekRange().start)}〜）。白い帯が成長の目安（週<b>10〜20セット</b>前後・個人差あり）。</div></div>`;

  const bwSec=`<div class="eyebrow">からだの変化</div>
    ${mealChangeHtml()}`;

  const measSec=`<div class="eyebrow">採寸（部位サイズ）</div>
    ${measCard}`;

  const SUBS=[['grow','成長','PR・グラフ'],['kiroku','記録','量・頻度'],['karada','からだ','体重・採寸']];
  const subbar=`<div class="subtabs">${SUBS.map(([k,label,sub])=>`<div class="weektab ${statsSub===k?'on':''}" data-sub="${k}">${label}<small>${sub}</small></div>`).join('')}</div>`;
  const groups={ grow:summarySec+weekSec+prSec+chartSec+stdSec, kiroku:calSec+volSec, karada:bwSec+measSec };

  v.innerHTML=`<div class="fade-in">${subbar}${groups[statsSub]||groups.grow}</div>`;

  v.querySelectorAll('[data-sub]').forEach(t=>t.onclick=()=>{ statsSub=t.dataset.sub; renderStats(); });
  v.querySelectorAll('[data-prm]').forEach(c=>c.onclick=()=>{ prMuscle=c.dataset.prm; renderStats(); });
  bindMealChange(v, ()=>renderStats());   // 体重・体脂肪率の入力口はここ1箇所だけ
  const _measSave=document.getElementById('measSave'); if(_measSave) _measSave.onclick=()=>{
    const val=parseFloat(document.getElementById('measIn').value); if(!val||val<=0){ toast('数値を入力してください'); return; }
    const i=meas.findIndex(x=>x.date===todayStr()&&x.key===measSel); if(i>=0)meas[i].v=val; else meas.push({date:todayStr(),key:measSel,v:val});
    saveAll(); toast(measName+'を記録しました'); renderStats(); };
  v.querySelectorAll('[data-meas]').forEach(c=>c.onclick=()=>{ measSel=c.dataset.meas; renderStats(); });
  v.querySelectorAll('[data-chartm]').forEach(c=>c.onclick=()=>{ chartMuscle=c.dataset.chartm; chartExId=null; renderStats(); });
  v.querySelectorAll('[data-chart]').forEach(c=>c.onclick=()=>{ chartExId=c.dataset.chart; renderStats(); });
}

// 分割メニューのパネル（設定タブのアコーディオン内で使う）——テンプレ作成＋日ごとの種目割り当て
function splitPanelHtml(){
  return `<div class="hint" style="margin:0 2px 12px">目的に合う分割をワンタップで用意（必要な種目も自動で追加）。<b>今の分割は置き換わります</b>（記録した内容は消えません）。</div>
    ${HYP_TEMPLATES.map(t=>`<div class="card"><div class="row" style="justify-content:space-between"><strong style="font-size:16px">${t.name}</strong><button class="btn ghost sm" data-tmpl="${t.key}">これにする</button></div>
      <div style="font-size:13px;color:var(--txt-2);line-height:1.6;margin-top:7px">${t.desc}</div>
      <div class="tmpl-days">${t.days.map(d=>d.name).join(' ／ ')}</div></div>`).join('')}
    <div class="eyebrow" style="margin-top:16px">いまの分割（種目を割り当て）</div>
    <div style="padding:0 2px 12px; color:var(--txt-3); font-size:13px; line-height:1.7;">各日にどの種目を入れるかをタップで編集。「今日」タブで前回の続きを自動でおすすめします。</div>
    ${routines.map(r=>{ const onIds=new Set(r.exIds);
      const tm=RT_MUS[r.name]||null;                       // この日の対象部位（複合日はnull）
      const showAll=rtShowAll.has(r.id)||!tm;
      const list=showAll?exercises:exercises.filter(e=>e.muscle===tm||onIds.has(e.id));
      const chips=list.map(e=>`<span class="chip ${onIds.has(e.id)?'on':''}" data-rt="${r.id}" data-ex="${e.id}">${e.name}</span>`).join('')
        || '<div class="hint" style="border:none;padding:6px 2px;margin:0">この部位の種目がありません。上の「種目を追加」で登録できます。</div>';
      const toggle=tm?`<button class="btn ghost sm" data-rtall="${r.id}" style="margin-top:11px">${showAll?'この部位の種目だけ表示':'＋ 他の部位の種目も表示'}</button>`:'';
      return `<div class="card"><div class="row" style="justify-content:space-between"><strong style="font-size:17px">${r.name}の日</strong><span class="tag">${r.exIds.length} 種目</span></div><div class="ex-pick">${chips}</div>${toggle}</div>`; }).join('')}`;
}
function wireSplitPanel(root){
  root.querySelectorAll('[data-tmpl]').forEach(b=>b.onclick=()=>{ if(!confirm('いまの分割をこのテンプレートで置き換えます。よろしいですか？\n（記録した内容は消えません）'))return;
    applyTemplate(b.dataset.tmpl); selRt=null; draftExId=null; toast('分割を作りました'); renderMore(); });
  root.querySelectorAll('[data-ex]').forEach(c=>c.onclick=()=>{ const r=rtObj(c.dataset.rt),id=c.dataset.ex;
    if(r.exIds.includes(id))r.exIds=r.exIds.filter(x=>x!==id); else r.exIds.push(id); saveAll(); renderMore(); });
  root.querySelectorAll('[data-rtall]').forEach(b=>b.onclick=()=>{ const id=b.dataset.rtall; rtShowAll.has(id)?rtShowAll.delete(id):rtShowAll.add(id); renderMore(); });
}

/* ============ 変化（進捗写真：向き・部位ごとのビフォー→アフター） ============ */
function cmpS(){ return cmpSel[phPose]||(cmpSel[phPose]={a:0,b:-1}); }
function renderPhotos(){
  const v=document.getElementById('view');
  const PO=POSES.find(o=>o.k===phPose)||POSES[0];
  const parr=photoCache.filter(p=>poseOf(p)===phPose).sort((a,b)=>(a.date+(a.createdAt||'')).localeCompare(b.date+(b.createdAt||'')));
  const cnt={}; photoCache.forEach(p=>{ const k=poseOf(p); cnt[k]=(cnt[k]||0)+1; });
  const poseTabs=`<div class="pose-tabs">${POSES.map(o=>`<span class="pose-tab ${o.k===phPose?'on':''}" data-pose="${o.k}">${o.n}${cnt[o.k]?`<span class="pt-n">${cnt[o.k]}</span>`:''}</span>`).join('')}</div>`;
  const poseGuide=`<div class="pose-guide"><b>${PO.n}のポーズ</b>：${PO.g}</div>`;
  // ---- ビフォー／アフター比較（今の向き・部位の中だけで） ----
  const S=cmpS();
  const cmpLatest=parr.length?new Date(parr[parr.length-1].date):null;
  const cmpFindAgo=days=>{ if(!parr.length)return 0; const target=cmpLatest-days*86400000; let best=0,bd=Infinity; parr.forEach((p,i)=>{ const dd=Math.abs(new Date(p.date)-target); if(dd<bd){bd=dd;best=i;} }); return best; };
  let cmpHtml, cmpUsed={a:null,b:null};
  if(parr.length<2){ cmpPick=null; cmpHtml=`<div class="hint" style="border:none;padding:0">「${PO.n}」の写真が2枚以上たまると、ビフォー／アフターを並べて比較できます。下の「＋ 「${PO.n}」の写真を追加」から今日の姿を残しましょう。${parr.length?'':'<br>すでにある写真をここへ移したい時は、写真をタップして下の「'+PO.n+'」を選びます。'}</div>`; }
  else { const ai=Math.min(Math.max(0,S.a),parr.length-1); const bi=S.b<0?parr.length-1:Math.min(S.b,parr.length-1);
    const opt=(sel)=>parr.map((p,i)=>`<option value="${i}" ${i===sel?'selected':''}>${fmtDateY(p.date)}</option>`).join('');
    const days=Math.abs(Math.round((new Date(parr[bi].date)-new Date(parr[ai].date))/86400000));
    const spanDays=Math.round((cmpLatest-new Date(parr[0].date))/86400000);
    const PRESETS=[['全期間',0],['1ヶ月',30],['3ヶ月',90],['6ヶ月',180],['1年',365]].filter(([l,d])=>d===0||spanDays>=d*0.8);
    const presetChips=`<div class="cmp-presets">${PRESETS.map(([lab,d])=>`<span class="cmp-chip" data-pdays="${d}">${d===0?'最初↔最新':lab+'前→最新'}</span>`).join('')}</div>`;
    const period=`<div class="cmp-period">期間：<b>${fmtDateY(parr[ai].date)}</b> → <b>${fmtDateY(parr[bi].date)}</b>　<span class="cmp-span">${days}日間${days>=7?`（約${Math.round(days/7)}週間）`:''}</span></div>`;
    cmpHtml=`${presetChips}${period}<div class="cmp">
      <div class="cmp-slot ${cmpPick==='a'?'picking':''}"><div class="cmp-tag">ビフォー（過去）</div>
        <div class="cmp-img" data-pickslot="a"><img src="${parr[ai].data}" alt=""></div>
        <div class="cmp-hint">${cmpPick==='a'?'下から選んでください':'タップして選ぶ'}</div>
        <label class="cmp-lbl">いつ</label><select id="cmpAsel">${opt(ai)}</select></div>
      <div class="cmp-slot ${cmpPick==='b'?'picking':''}"><div class="cmp-tag">アフター（最近）</div>
        <div class="cmp-img" data-pickslot="b"><img src="${parr[bi].data}" alt=""></div>
        <div class="cmp-hint">${cmpPick==='b'?'下から選んでください':'タップして選ぶ'}</div>
        <label class="cmp-lbl">いつ</label><select id="cmpBsel">${opt(bi)}</select></div></div>`;
    cmpUsed={a:parr[ai].id, b:parr[bi].id}; }
  // ---- すべての写真（月ごと・新しい順） ----
  const byMonth={}; [...parr].reverse().forEach(p=>{ const k=p.date.slice(0,7); (byMonth[k]=byMonth[k]||[]).push(p); });
  const monthKeys=Object.keys(byMonth).sort().reverse();
  const thBadge=id=>id===cmpUsed.a?'<span class="th-badge">ビフォー</span>':(id===cmpUsed.b?'<span class="th-badge">アフター</span>':'');
  const galleryHtml=monthKeys.length?monthKeys.map(k=>{ const [y,m]=k.split('-'); /* この向き・部位の写真だけ */
    return `<div class="ph-month">${+y}年${+m}月 <span class="ph-count">${byMonth[k].length}枚</span></div>
      <div class="photo-grid" style="grid-template-columns:repeat(4,1fr)">${byMonth[k].map(p=>`<div class="thumb ${cmpPick&&p.id===cmpUsed[cmpPick]?'pick-on':''} ${phSel&&phSel.has(p.id)?'sel-on':''}" data-pid="${p.id}"><img src="${p.data}" loading="lazy" alt="">${phSel?`<span class="th-check">${phSel.has(p.id)?'✓':''}</span>`:thBadge(p.id)}</div>`).join('')}</div>`; }).join('')
    : `<div class="empty" style="padding:22px">${IC.photos.replace('<svg','<svg width=28 height=28')}「${PO.n}」の写真はまだありません。<br>下の「＋ 写真を追加」から残しましょう。</div>`;

  const dCur=phDate||todayStr();
  const dLab=fmtDateY(dCur)+(dCur===todayStr()?'・今日':'');
  v.innerHTML=`<div class="fade-in">
    <div class="eyebrow">ビフォー → アフター</div>
    ${poseTabs}
    <div class="card">${poseGuide}${cmpHtml}</div>
    <div class="row" style="justify-content:space-between;align-items:center;margin:18px 4px 10px">
      <div class="eyebrow" style="margin:0" id="phAllTop">「${PO.n}」の写真</div>
      ${parr.length?`<button class="btn ghost sm" id="phSelBtn" style="width:auto;padding:0 14px">${phSel?'やめる':'選んで削除'}</button>`:''}
    </div>
    <div class="ph-addbar">
      <div class="ph-dt"><label>撮影日</label><input type="date" id="phDateIn" value="${dCur}"></div>
      <button class="btn ghost sm" id="phAdd">＋ 「${PO.n}」の写真を追加</button>
      <input type="file" id="phInput" accept="image/*" multiple style="display:none">
      <div class="ph-addnote">追加する写真は <b>${dLab}</b> で保存されます。昔の写真をまとめて入れる時は、先に日付を変えてから追加を。あとから1枚ずつ直すこともできます（写真をタップ）。</div>
    </div>
    ${phSel?`<div class="pickbar"><div class="pb-t">消したい写真をタップ（${phSel.size}枚 選択中）</div><button class="pb-x" id="selDel" ${phSel.size?'':'disabled'}>削除</button><button class="pb-x" id="selCancel">やめる</button></div>`:''}
    ${cmpPick?`<div class="pickbar"><div class="pb-t">${cmpPick==='a'?'ビフォー':'アフター'}にする写真をタップ</div><button class="pb-x" id="pickCancel">やめる</button></div>`:''}
    ${galleryHtml}</div>`;

  // 向き・部位の切替（比較の選択は部位ごとに覚えておく）
  v.querySelectorAll('[data-pose]').forEach(c=>c.onclick=()=>{ phPose=c.dataset.pose; cmpPick=null; phSel=null; renderPhotos();
    const t=document.querySelector('#view .fade-in'); if(t)t.scrollIntoView({behavior:'smooth',block:'start'}); });
  const ca=document.getElementById('cmpAsel'); if(ca)ca.onchange=e=>{ S.a=+e.target.value; renderPhotos(); };
  const cb=document.getElementById('cmpBsel'); if(cb)cb.onchange=e=>{ S.b=+e.target.value; renderPhotos(); };
  v.querySelectorAll('[data-pdays]').forEach(c=>c.onclick=()=>{ const d=+c.dataset.pdays; cmpPick=null; S.b=parr.length-1; S.a=(d===0?0:cmpFindAgo(d)); renderPhotos(); });
  // 比較枠をタップ → 下の一覧から選ぶモードへ（もう一度タップで解除）
  v.querySelectorAll('[data-pickslot]').forEach(t=>t.onclick=()=>{ const s=t.dataset.pickslot;
    cmpPick=(cmpPick===s)?null:s; renderPhotos();
    if(cmpPick){ const g=document.getElementById('phAllTop'); if(g)g.scrollIntoView({behavior:'smooth',block:'start'}); } });
  const pkX=document.getElementById('pickCancel'); if(pkX)pkX.onclick=()=>{ cmpPick=null; renderPhotos(); };
  // まとめて削除モード
  const selBtn=document.getElementById('phSelBtn'); if(selBtn)selBtn.onclick=()=>{ phSel=phSel?null:new Set(); cmpPick=null; renderPhotos(); };
  const selX=document.getElementById('selCancel'); if(selX)selX.onclick=()=>{ phSel=null; renderPhotos(); };
  const selD=document.getElementById('selDel'); if(selD)selD.onclick=async()=>{ if(!phSel||!phSel.size)return;
    if(!confirm(`選んだ${phSel.size}枚を削除しますか？（元に戻せません）`))return;
    for(const id of phSel){ try{ await photoDelDB(id); }catch(err){} }
    photoCache=photoCache.filter(p=>!phSel.has(p.id)); const n=phSel.size; phSel=null; cmpSel={}; render(); toast(`${n}枚を削除しました`); };
  // 一覧のタップ：削除モード中は選択、比較モード中は比較枠へ、通常は拡大表示
  v.querySelectorAll('[data-pid]').forEach(t=>t.onclick=()=>{ const id=t.dataset.pid;
    if(phSel){ phSel.has(id)?phSel.delete(id):phSel.add(id); renderPhotos(); return; }
    if(!cmpPick){ openPhoto(id); return; }
    const i=parr.findIndex(p=>p.id===id); if(i<0)return;
    const other=cmpPick==='a'?(S.b<0?parr.length-1:Math.min(S.b,parr.length-1)):Math.min(Math.max(0,S.a),parr.length-1);
    if(i===other){ const cur=cmpPick==='a'?Math.min(Math.max(0,S.a),parr.length-1):(S.b<0?parr.length-1:Math.min(S.b,parr.length-1));
      if(cmpPick==='a'){ S.b=cur; } else { S.a=cur; } }   // 反対側の写真を選んだら入れ替え
    if(cmpPick==='a') S.a=i; else S.b=i;
    cmpPick=null; renderPhotos();
    const top=document.querySelector('#view .cmp'); if(top)top.scrollIntoView({behavior:'smooth',block:'center'}); });
  const dIn=document.getElementById('phDateIn'); if(dIn)dIn.onchange=e=>{ phDate=e.target.value||todayStr(); renderPhotos(); };
  const phAdd=document.getElementById('phAdd'); const phInput=document.getElementById('phInput');
  if(phAdd&&phInput){ phAdd.onclick=()=>phInput.click();
    phInput.onchange=async e=>{ const files=[...e.target.files]; if(!files.length)return; const d=phDate||todayStr(); toast('写真を保存中…');
      try{ await addPhotos(files,d,phPose); }catch(err){ toast('保存に失敗しました'); } e.target.value=''; cmpSel={}; renderPhotos();
      toast(`${fmtDateY(d)}の「${PO.n}」に${files.length}枚 追加しました`); }; }
}

/* ============ バックアップ ============ */
function exportData(){
  const data={app:'ATLAS', ver:4, exportedAt:new Date().toISOString(), exercises, logs, routines, bw, meas, settings, prog, dayInfo, photos:photoCache};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); const d=new Date();
  const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href=URL.createObjectURL(blob); a.download=`atlas-backup-${stamp}.json`; a.click(); URL.revokeObjectURL(a.href);
  settings.lastBackupAt=new Date().toISOString(); delete settings.backupSnooze; saveAll();
  toast('書き出しました');
}
function importData(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{ try{ const d=JSON.parse(reader.result);
    if(!d.logs||!d.exercises){ toast('対応していないファイルです'); return; }
    if(!confirm('現在のデータをこのバックアップで置き換えます。よろしいですか？'))return;
    exercises=d.exercises||DEFAULT_EX; logs=d.logs||[]; routines=d.routines||DEFAULT_ROUTINES; bw=d.bw||[]; meas=d.meas||[];
    settings=Object.assign({rest:90,autoTimer:true,sound:true,soundType:'beep3',soundLong:true,autoRestType:true,bar:20,smithBar:10,units:'kg',sex:'male',goal:'hypertrophy',level:'int',days:4,physique:null,theme:'light',onboarded:true},d.settings||{});
    if(d.prog) prog=d.prog;
    if(d.dayInfo && typeof d.dayInfo==='object') dayInfo=d.dayInfo;
    saveAll();
    if(Array.isArray(d.photos)){ try{ await photoClearDB(); for(const p of d.photos){ await photoPut(p); } photoCache=d.photos; }catch(err){} }
    selRt=null; draftExId=null; applyTheme(); toast('読み込みました'); renderMore();
  }catch(err){ toast('読み込みに失敗しました'); } };
  reader.readAsText(file); e.target.value='';
}

let stickSel={bench:null,squat:null,dead:null};
function round25(x){ return Math.round(x/2.5)*2.5; }
function bestE1rm(exId){ let m=0; logs.filter(l=>l.exId===exId).forEach(l=>l.sets.forEach(s=>{ const e=est1rm(setKg(s,l.date),s.r); if(e>m)m=e; })); return m; }
function liftTrend(exId){ const byDate={}; logs.filter(l=>l.exId===exId).forEach(l=>{ const m=Math.max(...l.sets.map(s=>est1rm(setKg(s,l.date),s.r))); byDate[l.date]=Math.max(byDate[l.date]||0,m); });
  return Object.keys(byDate).sort().map(d=>Math.round(byDate[d])); }
function stallStatus(exId){ const t=liftTrend(exId);
  if(t.length<3) return {state:'few',t};
  const recentMax=Math.max(...t.slice(-3)); const priorMax=Math.max(...t.slice(0,-3),0);
  return {state: recentMax>priorMax?'prog':'stall', t}; }

/* ============ ルーター ============ */
/* ============ 食事（仕様書 KEIRYO-SPEC-v2.md）============
   設計思想：日単位の完璧主義を捨て、週単位で帳尻を合わせる。
   1日オーバーしても赤警告は出さない。週予算を超えた時だけ警告する。
   ★集計は必ず m.d（その記録が属する1日）で行う。m.at（実時刻）は表示専用。
     深夜0:30の食事を at で集計すると、前日と当日の両方の数字が壊れる。
   計算は必ず keiryo-calc.js（グローバル KEIRYO）を通す。係数をここに書かない。 */
const _me=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function nutriCfg(){
  if(!settings.nutri||typeof settings.nutri!=='object') settings.nutri={};
  const n=settings.nutri;
  if(n.activity==null)     n.activity=KEIRYO.DEFAULT_ACTIVITY;
  if(n.deficit==null)      n.deficit=KEIRYO.DEFAULT_DEFICIT;
  if(n.targetBf==null)     n.targetBf=10;
  if(n.boundaryHour==null) n.boundaryHour=KEIRYO.DEFAULT_BOUNDARY_HOUR;
  if(n.eatOutKcal==null)   n.eatOutKcal=KEIRYO.DEFAULT_EAT_OUT_KCAL;
  return n;
}
function mealBoundary(){ return nutriCfg().boundaryHour; }
function mealLogDate(dt){ return KEIRYO.toLogDate(dt||new Date(), mealBoundary()); }
function mealPresetList(){
  if(!Array.isArray(mealPresets)){ mealPresets=JSON.parse(JSON.stringify(KEIRYO.DEFAULT_PRESETS)); saveAllLocal(); }
  migratePresets();
  return mealPresets;
}
/* 既に保存済みの人向けの1回だけの直し（2食目をメインに・鮭は焼き・豆腐→ヨーグルト）。
   中身をまだ触っていないセットだけ入れ替える。自分で編集した人は上書きしない。 */
function migratePresets(){
  const n=nutriCfg(); if(n.presetMig1) return;
  const sig=p=>p.items.map(i=>i.foodId+':'+i.qty).join(',');
  const oldSig={
    'meal-2':'chicken-thigh-skinless:2.5,rice:2,broccoli:1.5',
    'meal-3':'chicken-thigh-skinless:2,salmon:1,tofu-momen:1,rice:1.5,misoshiru:1'
  };
  const untouched=['meal-2','meal-3'].every(id=>{
    const p=mealPresets.find(x=>x.id===id); return p && sig(p)===oldSig[id];
  });
  if(untouched){
    ['meal-2','meal-3'].forEach(id=>{
      const cur=mealPresets.find(x=>x.id===id), def=KEIRYO.DEFAULT_PRESETS.find(x=>x.id===id);
      if(cur&&def){ cur.items=JSON.parse(JSON.stringify(def.items)); cur.ml=def.ml; cur.hour=def.hour; syncPresetSummary(cur); }
    });
  }
  mealPresets.forEach(p=>{ if(!p.summary) syncPresetSummary(p); });
  n.presetMig1=1; saveAll();
}
/** 体重は ATLAS の記録（bw）を使う。食事タブで二重に入力させない */
function latestBw(){ if(!bw||!bw.length) return null; return [...bw].sort((a,b)=>a.date<b.date?1:-1)[0]; }
/** 目標一式。体重か体脂肪率が欠けていれば null を返す（推定で誤魔化さない） */
function nutriPlan(){
  const b=latestBw(), n=nutriCfg();
  if(!b||!(+b.kg>0)) return null;
  const bf=(b.bf!=null?+b.bf:(n.bfPct!=null?+n.bfPct:null));
  if(!(bf>0)) return null;
  return KEIRYO.buildPlan({ body:{weightKg:+b.kg, bodyFatPct:bf}, activity:+n.activity, deficit:+n.deficit,
    overrideKcal:(n.overrideKcal!=null?+n.overrideKcal:undefined) });
}
function mealsOn(d){ return meals.filter(m=>m.d===d).sort((a,b)=>((a.at||'')<(b.at||'')?-1:1)); }
/* ---- 水分とカフェイン ----
   目標は「飲み物として記録したぶん」で数える。食品の水分は勘定に入れない（そのぶん目標は安全側）。
   筋トレした日は ATLAS のトレ時間から自動で目標が増える。 */
function drinkPresetList(){
  if(!Array.isArray(drinkPresets)){ drinkPresets=JSON.parse(JSON.stringify(KEIRYO.DEFAULT_DRINKS)); saveAllLocal(); }
  migrateDrinks();
  return drinkPresets;
}
/* 既に保存済みの人向けの1回だけの直し。
   ヴァーチュオを初期値(230ml)のまま使っている人だけ 500ml に直す。
   自分で数字を変えた人は上書きしない。 */
function migrateDrinks(){
  const n=nutriCfg(); if(n.drinkMig1) return;
  const v=drinkPresets.find(d=>d.id==='vertuo');
  if(!v){
    const def=KEIRYO.DEFAULT_DRINKS.find(d=>d.id==='vertuo');
    if(def) drinkPresets.push(JSON.parse(JSON.stringify(def)));
  }else if(+v.ml===230){
    v.ml=500; v.name='ヴァーチュオ（氷入り）';
  }
  n.drinkMig1=1; saveAll();
}
function drinksOn(d){ return drinks.filter(x=>x.d===d).sort((a,b)=>((a.at||'')<(b.at||'')?-1:1)); }
/** その日のトレ時間（分）。ATLAS の記録をそのまま使う */
function mealTrainMin(d){ try{ const m=sessionMinutes(d); return (m!=null&&m>0)?m:0; }catch(e){ return 0; } }
function waterTargetFor(d){
  const b=latestBw(); if(!b||!(+b.kg>0)) return null;
  const n=nutriCfg();
  if(n.waterOverride!=null) return +n.waterOverride;
  return KEIRYO.waterTargetMl(+b.kg, {trainingMinutes: mealTrainMin(d)});
}

/* ---- サプリメント ----
   カロリーはほぼ無いので「今日飲んだかどうか」だけを記録する。押すたびに 飲んだ↔まだ が切り替わる。 */
function suppPresetList(){
  if(!Array.isArray(suppPresets)){ suppPresets=JSON.parse(JSON.stringify(KEIRYO.DEFAULT_SUPPS)); saveAllLocal(); }
  return suppPresets;
}
function suppsOn(d){ return Array.isArray(supps[d])?supps[d]:[]; }
function toggleSupp(d,sid){
  const cur=suppsOn(d).slice(), i=cur.indexOf(sid);
  if(i>=0)cur.splice(i,1); else cur.push(sid);
  if(cur.length)supps[d]=cur; else delete supps[d];
  saveAll(); renderMeal();
}

/* ---- 記録した時刻をあとから直す ----
   「食べたのは19時だけど記録したのは21時」がふつうに起きる。
   日付(d)は動かさず、時刻だけを付け替える（境界より前の時刻なら実日付は翌日側になる）。 */
function setRecordTime(id,isDrink,hhmm){
  const arr=isDrink?drinks:meals, rec=arr.find(x=>x.id===id);
  if(!rec||!/^\d{2}:\d{2}$/.test(hhmm)) return;
  const [h,mi]=hhmm.split(':').map(Number);
  const base=new Date(rec.d+'T00:00:00');
  base.setHours(h,mi,0,0);
  if(h<mealBoundary()) base.setDate(base.getDate()+1);
  rec.at=base.toISOString();
  saveAll(); renderMeal();
}

/* ---- 見ている日（過去にさかのぼって記録・修正できる）----
   記録の入れ忘れは必ず起きる。後から埋められないと週予算も7日平均も狂うため、
   食事タブは常に「見ている日」を持ち、記録も体重もその日に入る。 */
let mealViewDate=null;                       // null = 今日
function mealViewD(){ const t=mealLogDate(); return (mealViewDate&&mealViewDate<t)?mealViewDate:t; }
function isMealToday(){ return mealViewD()===mealLogDate(); }
function moveMealDate(days){
  const t=mealLogDate(), next=KEIRYO.addLogDays(mealViewD(),days);
  if(next>t){ mealViewDate=null; } else { mealViewDate=(next===t?null:next); }
  renderMeal();
}

/* ---- 集計のもと ---- */
function mealWeighIns(){ return (bw||[]).map(b=>({logDate:b.date, weightKg:+b.kg, isReference:!!b.ref})); }
/** 7日移動平均。判断は生の体重では絶対に行わない（仕様書 §7） */
function mealAvg(endLogDate){ return KEIRYO.movingAverage(mealWeighIns(), endLogDate, 7); }
function mealWeekIntakes(vd){
  const dates=KEIRYO.weekDates(vd), map={};
  meals.forEach(m=>{ if(dates.indexOf(m.d)>=0){
    if(!map[m.d]) map[m.d]={logDate:m.d, kcal:0, proteinG:0};
    map[m.d].kcal+=(+m.k||0); map[m.d].proteinG+=(+m.p||0); } });
  drinks.forEach(x=>{ if(dates.indexOf(x.d)>=0){
    if(!map[x.d]) map[x.d]={logDate:x.d, kcal:0, proteinG:0};
    map[x.d].kcal+=(+x.k||0); } });
  return Object.keys(map).map(k=>map[k]);
}
/* 外食日：既定は「毎週◯曜」。週ごとにその都度上書きできる（仕様書 §4-2）*/
function eatOutOv(){ const c=nutriCfg(); if(!c.eatOutOv||typeof c.eatOutOv!=='object') c.eatOutOv={}; return c.eatOutOv; }
function weekEatOutDates(weekStartD){
  const ov=eatOutOv();
  if(Object.prototype.hasOwnProperty.call(ov,weekStartD)) return (ov[weekStartD]||[]).slice();
  const n=nutriCfg();
  return (n.eatOutDow!=null&&n.eatOutDow!=='')?[KEIRYO.eatOutDateForWeek(weekStartD,+n.eatOutDow)]:[];
}
function toggleEatOut(dt){
  const ws=KEIRYO.weekStart(dt), cur=weekEatOutDates(ws), i=cur.indexOf(dt);
  if(i>=0)cur.splice(i,1); else cur.push(dt);
  cur.sort(); eatOutOv()[ws]=cur; saveAll(); renderMeal();
}
function mealWeekPlan(plan,vd){
  return KEIRYO.planWeek({dailyTargetKcal:plan.kcal, eatOutDates:weekEatOutDates(KEIRYO.weekStart(vd)),
    eatOutKcal:+nutriCfg().eatOutKcal});
}
/** その日の目標。P と F は日次で不変、C だけがその日の枠に合わせて動く（仕様書 §7） */
function mealDayTarget(plan,wplan,vd){
  return KEIRYO.macrosForCalories(KEIRYO.dailyTargetFor(wplan,vd), plan.lbmKg, +latestBw().kg);
}
/** PFC のリングゲージ。真ん中に今の量、下に「あと◯g」。
    横棒だと3本並んだ時に「どれがどれだけ足りないか」が瞬時に読めないため、
    数字を主役にしたゲージにしている。 */
function macroRing(label,now,target){
  const r=30, C=2*Math.PI*r, ARC=C*0.75;                 // 下を開けた270度のゲージ
  const pct=target>0?Math.min(1,now/target):0;
  const done=target>0&&now>=target;
  const col=done?'var(--pos)':'var(--blue)';
  const left=Math.max(0,Math.round(target-now));
  return `<div class="m-ring">
    <div class="m-ring-l">${label}</div>
    <svg viewBox="0 0 80 80" class="m-ring-s" aria-hidden="true">
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${ARC.toFixed(1)} ${C.toFixed(1)}" transform="rotate(135 40 40)"/>
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${(ARC*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(135 40 40)"/>
      <text x="40" y="40" class="m-ring-v">${Math.round(now)}</text>
      <text x="40" y="53" class="m-ring-t">/ ${target}g</text>
    </svg>
    <div class="m-ring-b${done?' on':''}">${done?'達成':'あと '+left+'g'}</div>
  </div>`;
}
/** その日の摂取合計（食事＋飲み物）。飲み物のカロリーも1日の合計に入れる */
function mealEatenOn(vd){
  const rowsOn=mealsOn(vd), dOn=drinksOn(vd);
  const dSum=KEIRYO.sumDrinks(dOn.map(x=>({ml:x.ml,caffeineMg:x.caf,kcal:x.k})));
  const f=KEIRYO.sumNutrition(rowsOn.map(m=>({kcal:m.k,proteinG:m.p,fatG:m.f,carbG:m.c})));
  const mealMl=rowsOn.reduce((a,m)=>a+(+m.ml||0),0);
  return { rowsOn, dOn, dSum, mealMl, totalMl:dSum.ml+mealMl,
    kcal:f.kcal+dSum.kcal, proteinG:f.proteinG, fatG:f.fatG, carbG:f.carbG, drinkKcal:dSum.kcal };
}

/* 取り消しバー（5秒）。誤タップ対策はこれで行う＝記録時に確認ダイアログを出さない */
let _mealUndoT=null;
function mealUndoBar(){
  let el=document.getElementById('mealUndo');
  if(!el){ el=document.createElement('div'); el.id='mealUndo'; el.className='mundo'; document.body.appendChild(el); }
  return el;
}
function showMealUndo(m){
  const el=mealUndoBar();
  el.innerHTML=`<span class="mu-t">${_me(m.n)} を記録しました</span><button id="mealUndoBtn">取り消す</button>`;
  el.classList.add('show');
  document.getElementById('mealUndoBtn').onclick=()=>{ (m._drink?delDrink:delMeal)(m.id); hideMealUndo(); };
  clearTimeout(_mealUndoT); _mealUndoT=setTimeout(hideMealUndo,5000);
}
function hideMealUndo(){ const el=document.getElementById('mealUndo'); if(el)el.classList.remove('show'); clearTimeout(_mealUndoT); }

/* ---- 記録 ---- */
function mealStampAt(d){
  const now=new Date();
  if(d===mealLogDate()) return now.toISOString();
  const base=new Date(d+'T00:00:00');
  base.setHours(now.getHours(), now.getMinutes(), 0, 0);
  if(now.getHours()<mealBoundary()) base.setDate(base.getDate()+1);
  return base.toISOString();
}
function pushMeal(name,n,items,ml){
  const d=mealViewD();
  const m={ id:'m'+Date.now()+Math.random().toString(36).slice(2,6), d, at:mealStampAt(d),
    n:name, k:Math.round(n.kcal*10)/10, p:Math.round(n.proteinG*10)/10, f:Math.round(n.fatG*10)/10, c:Math.round(n.carbG*10)/10,
    ml:Math.max(0,+ml||0), items:items||[] };
  meals.push(m); saveAll(); renderMeal(); showMealUndo(m); return m;
}
function logMealPreset(p){
  let n; try{ n=KEIRYO.nutritionOfPreset(p,myFoods); }catch(e){ toast('この定型セットに未登録の食品があります'); return; }
  pushMeal(p.name,n,p.items,p.ml);
}
function delMeal(id){ meals=meals.filter(x=>x.id!==id); saveAll(); if(tab==='meal')renderMeal(); }
function logDrink(p){
  const d=mealViewD();
  const rec={ id:'w'+Date.now()+Math.random().toString(36).slice(2,6), d, at:mealStampAt(d),
    n:p.name, ml:+p.ml||0, caf:+p.caffeineMg||0, k:+p.kcal||0 };
  drinks.push(rec); saveAll(); renderMeal();
  showMealUndo({id:rec.id, n:rec.n, _drink:true});
  return rec;
}
function delDrink(id){ drinks=drinks.filter(x=>x.id!==id); saveAll(); if(tab==='meal')renderMeal(); }

const MEAL_WK=['日','月','火','水','木','金','土'];
const mealDow=d=>MEAL_WK[new Date(d+'T00:00:00').getDay()];
const mealMD=d=>{ const p=d.split('-'); return (+p[1])+'/'+(+p[2]); };

/* =========================================================================
   食事タブ ＝ 「記録するところ」だけ。
   変化を見るのは分析タブ、設定は設定タブ。1つのタブに1つの役割。
   ========================================================================= */
function renderMeal(){
  const v=document.getElementById('view');
  const vd=mealViewD(), isToday=isMealToday();
  const plan=nutriPlan(), list=mealPresetList(), n=nutriCfg();
  const E=mealEatenOn(vd);

  const nav=`<div class="m-nav">
    <button class="m-nav-b" data-mnav="-1" aria-label="前の日"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="m-nav-d"><b>${mealMD(vd)}（${mealDow(vd)}）</b>${isToday?'<span class="m-nav-t">今日</span>':''}</div>
    <button class="m-nav-b${isToday?' off':''}" data-mnav="1" aria-label="次の日"${isToday?' disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    ${isToday?'':'<button class="m-link m-nav-now" id="mNavNow">今日へ</button>'}
  </div>
  ${(isToday&&KEIRYO.isLateNight(new Date(),mealBoundary()))
    ?`<div class="m-late">いまは深夜なので、${KEIRYO.logDateLabel(new Date(),mealBoundary())}</div>`:''}`;

  /* --- 食べる：1タップで即記録 --- */
  const presets=list.map((p,i)=>{
    let nu; try{ nu=KEIRYO.nutritionOfPreset(p,myFoods); }catch(e){ nu=KEIRYO.EMPTY_NUTRITION; }
    return `<button class="mpreset" data-mp="${i}"><span class="mp-n">${_me(p.name)}</span>
      <span class="mp-s">${_me(p.summary||'')}</span>
      <span class="mp-k">${Math.round(nu.kcal).toLocaleString()} kcal ・ P${Math.round(nu.proteinG)}</span></button>`;
  }).join('')+`<button class="mpreset mp-manual" data-mmanual="1"><span class="mp-n">手で入力</span>
      <span class="mp-s">外食など。だいたいの値でかまいません</span><span class="mp-k">＋ 追加</span></button>`;

  /* --- 目標がまだ出せない時 --- */
  const setup=plan?'':`<div class="card">
    <div class="lbl">目標を出すのに、あと1つ</div>
    <div class="hint" style="margin:8px 0 0">「分析」タブで<b>体重と体脂肪率</b>を記録すると、ここに目標カロリーとPFCが出ます。</div>
  </div>`;

  let wplan=null, dayT=null, isEatOut=false;
  if(plan){ wplan=mealWeekPlan(plan,vd); dayT=mealDayTarget(plan,wplan,vd); isEatOut=wplan.eatOutDates.indexOf(vd)>=0; }

  /* --- その日の残り --- */
  const goal=plan?`<div class="card">
    <div class="lbl">${isToday?'今日':mealMD(vd)}の残り${isEatOut?'（外食日）':''}</div>
    <div class="m-rest"><span class="big">${Math.round(dayT.kcal-E.kcal).toLocaleString()}</span><span class="u">kcal ／ 目標 ${dayT.kcal.toLocaleString()}</span></div>
    <div class="m-bar"><span style="width:${dayT.kcal>0?Math.min(100,E.kcal/dayT.kcal*100):0}%"></span></div>
    <div class="m-rings">
      ${macroRing('タンパク質',E.proteinG,plan.proteinG)}
      ${macroRing('脂質',E.fatG,dayT.fatG)}
      ${macroRing('炭水化物',E.carbG,dayT.carbG)}
    </div>
  </div>`:'';

  /* --- 飲む：水分 --- */
  const dlist=drinkPresetList();
  const wt=waterTargetFor(vd), train=mealTrainMin(vd);
  const lastCaf=E.dOn.filter(x=>x.caf>0).slice(-1)[0];
  const caf=KEIRYO.caffeineStatus(E.dSum.caffeineMg,
    lastCaf?{lastAtHour:new Date(lastCaf.at).getHours(), bedHour:(n.bedHour==null?2:+n.bedHour)}:{});
  const cafCol={ok:'var(--txt-2)', near:'#c9962f', late:'#c9762f', over:'var(--danger)'}[caf.level];
  const chips=dlist.map((p,i)=>`<button class="m-dr" data-dr="${i}">
    <span class="m-dr-n">${_me(p.name)}</span><span class="m-dr-m">${p.ml}ml${p.caffeineMg>0?' ・'+p.caffeineMg+'mg':''}</span></button>`).join('')
    +`<button class="m-dr m-dr-add" data-drmanual="1"><span class="m-dr-n">その他</span><span class="m-dr-m">手で入力</span></button>`;

  let waterCard;
  if(wt==null){
    waterCard=`<div class="card"><div class="lbl">水分</div>
      <div class="hint" style="margin-top:8px">「分析」タブで体重を記録すると、1日に何本ぶん飲めばいいかが出ます。</div>
      <div class="m-drs">${chips}</div></div>`;
  }else{
    const cup=(n.cupMl>0?+n.cupMl:500);
    const cu=KEIRYO.waterCups(E.totalMl, wt, cup);
    const hs=KEIRYO.hydrationStatus(E.totalMl, wt);
    const col=hs.level==='done'?'var(--pos)':'#3f8fb0';
    const pips=Array.from({length:cu.total},(_,i)=>`<span class="m-pip${i<cu.done?' on':''}"></span>`).join('');
    waterCard=`<div class="card">
      <div class="m-wk-top"><span class="lbl" style="margin:0">水分</span>
        <span class="m-wk-n">${E.totalMl.toLocaleString()}<small> / ${wt.toLocaleString()} ml</small></span></div>
      <div class="m-water-h" style="color:${col}">${cu.remaining===0?'今日のぶんは飲みきりました':`あと <b>${cu.remaining}</b> 本`}<span class="m-water-u">${cup}ml を1本として</span></div>
      <div class="m-pips">${pips}</div>
      ${E.mealMl>0?`<div class="m-wk-msg">うち ${E.mealMl.toLocaleString()}ml は食事ぶん（プロテインの水・味噌汁など）を自動で数えています。</div>`:''}
      ${E.dSum.caffeineMg>0?`<div class="m-caf" style="color:${cafCol}">カフェイン ${E.dSum.caffeineMg}mg / 目安 ${KEIRYO.CAFFEINE_DAILY_MAX_MG}mg${caf.message?'　'+_me(caf.message):''}</div>`:''}
      <div class="m-drs">${chips}</div>
    </div>`;
  }

  /* --- その日の記録（食べたもの・飲んだものを1つの並びに） --- */
  const items=E.rowsOn.map(m=>({at:m.at,n:m.n,r:Math.round(m.k).toLocaleString()+' kcal',id:m.id,d:0}))
    .concat(E.dOn.map(x=>({at:x.at,n:x.n,r:x.ml+'ml'+(x.caf>0?' ・ '+x.caf+'mg':''),id:x.id,d:1})))
    .sort((a,b)=>((a.at||'')<(b.at||'')?-1:1));
  const rows=items.length?`<ul class="m-list">${items.map(m=>`<li>
      <input class="m-t" type="time" value="${m.at?new Date(m.at).toTimeString().slice(0,5):''}" data-tset="${m.id}" data-tdr="${m.d}" aria-label="時刻">
      <span class="n">${_me(m.n)}</span>
      <span class="k">${_me(m.r)}</span>
      <button class="x" data-${m.d?'drdel':'mdel'}="${m.id}" aria-label="削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </li>`).join('')}
    <div class="hint" style="border:none;padding:8px 0 0">時刻を押すと、食べた時間に直せます。</div></ul>`
    :`<div class="hint" style="border:none;padding:6px 0">${isToday
        ?'まだ記録がありません。上のボタンを1回押すだけで記録されます。'
        :'この日の記録はありません。上のボタンを押すと、この日のぶんとして入ります。'}</div>`;

  /* --- サプリ：飲んだかどうかだけ。押すと 飲んだ↔まだ が切り替わる --- */
  const slist=suppPresetList(), taken=suppsOn(vd);
  const suppCard=`<div class="card">
    <div class="m-wk-top"><span class="lbl" style="margin:0">サプリ</span>
      <span class="m-wk-n">${taken.length}<small> / ${slist.length}</small></span></div>
    <div class="m-sups">${slist.map(sp=>{
      const on=taken.indexOf(sp.id)>=0;
      return `<button class="m-sup${on?' on':''}" data-sup="${_me(sp.id)}">
        <span class="m-sup-c">${on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"/></svg>':''}</span>
        <span class="m-sup-t"><b>${_me(sp.name)}</b><small>${_me(sp.note||'')}</small></span></button>`;
    }).join('')||'<div class="hint" style="border:none;padding:2px 0">サプリが登録されていません。設定から追加できます。</div>'}</div>
    <div class="hint" style="margin-top:9px">押すと「飲んだ」になります。カロリーは数えません（サプリはほぼ0kcalのため）。</div>
  </div>`;

  /* --- 今週の予算（外食日をその都度きめる） --- */
  let weekCard='';
  if(plan){
    const wp=KEIRYO.weekProgress(wplan, mealWeekIntakes(vd), vd);
    const used=wp.weeklyBudgetKcal-wp.remainingKcal;
    const pct=Math.min(100, Math.max(0, used/wp.weeklyBudgetKcal*100));
    const col=wp.status==='over'?'var(--danger)':(wp.status==='tight'?'#c9962f':'var(--pos)');
    const eoChips=KEIRYO.weekDates(vd).map(dt=>{
      const on=wplan.eatOutDates.indexOf(dt)>=0;
      return `<button class="m-eo${on?' on':''}${dt===vd?' cur':''}" data-eo="${dt}" title="${dt}">${mealDow(dt)}</button>`;
    }).join('');
    weekCard=`<div class="card">
      <div class="m-wk-top"><span class="lbl" style="margin:0">今週の予算</span>
        <span class="m-wk-n">${Math.round(wp.remainingKcal).toLocaleString()}<small> / ${wp.weeklyBudgetKcal.toLocaleString()}</small></span></div>
      <div class="m-bar" style="margin-top:9px"><span style="width:${pct}%;background:${col}"></span></div>
      <div class="m-wk-msg">${wp.message}</div>
      <div class="m-eo-row"><span class="m-eo-l">外食する日</span>${eoChips}</div>
      <div class="hint" style="margin-top:8px">${wplan.eatOutDates.length
        ? `外食日は ${wplan.eatOutDates.map(x=>mealMD(x)+'（'+mealDow(x)+'）').join('・')}。先に ${(+n.eatOutKcal).toLocaleString()}kcal ずつ取り置いて、残り${wplan.normalDays}日は1日 <b>${wplan.normalTargetKcal.toLocaleString()}kcal</b> です。`
        : '曜日を押すと、その日を外食日にできます。先に取り置いて残りの日に配り直します。'}</div>
    </div>`;
  }

  v.innerHTML=`<div class="fade-in">
    <div class="eyebrow">食事</div>
    ${nav}
    <div class="mpresets">${presets}</div>
    ${setup}${goal}${waterCard}
    <div class="card"><div class="lbl">${isToday?'今日':mealMD(vd)+'（'+mealDow(vd)+'）'}の記録</div><div style="margin-top:11px">${rows}</div></div>
    ${suppCard}
    ${weekCard}
    <div class="m-where">
      <button class="m-where-b" data-go="stats"><b>変化を見る</b><span>分析 › からだ</span></button>
      <button class="m-where-b" data-go="more"><b>設定を変える</b><span>設定 › 食事・減量</span></button>
    </div>
  </div>`;

  v.querySelectorAll('[data-mnav]').forEach(b=>{ b.onclick=()=>moveMealDate(+b.dataset.mnav); });
  const nw=document.getElementById('mNavNow'); if(nw)nw.onclick=()=>{ mealViewDate=null; renderMeal(); };
  v.querySelectorAll('[data-mp]').forEach(b=>{ b.onclick=()=>logMealPreset(list[+b.dataset.mp]); });
  v.querySelectorAll('[data-mdel]').forEach(b=>{ b.onclick=()=>delMeal(b.dataset.mdel); });
  v.querySelectorAll('[data-dr]').forEach(b=>{ b.onclick=()=>logDrink(drinkPresetList()[+b.dataset.dr]); });
  v.querySelectorAll('[data-drdel]').forEach(b=>{ b.onclick=()=>delDrink(b.dataset.drdel); });
  v.querySelectorAll('[data-eo]').forEach(b=>{ b.onclick=()=>toggleEatOut(b.dataset.eo); });
  const mm=v.querySelector('[data-mmanual]'); if(mm) mm.onclick=()=>openManualMeal();
  const dm=v.querySelector('[data-drmanual]'); if(dm) dm.onclick=()=>openManualDrink();
  v.querySelectorAll('[data-sup]').forEach(b=>{ b.onclick=()=>toggleSupp(vd,b.dataset.sup); });
  v.querySelectorAll('[data-tset]').forEach(inp=>{ inp.onchange=()=>setRecordTime(inp.dataset.tset, inp.dataset.tdr==='1', inp.value); });
  v.querySelectorAll('[data-go]').forEach(b=>{ b.onclick=()=>{
    if(b.dataset.go==='stats') statsSub='karada';
    setTab(b.dataset.go); window.scrollTo(0,0); }; });
}

/* =========================================================================
   分析タブに置く「からだの変化」。体重の入力口はここ1箇所だけ。
   ========================================================================= */
function mealChangeHtml(){
  const d=mealLogDate(), n=nutriCfg(), plan=nutriPlan();
  const avgNow=mealAvg(d), avgPrev=mealAvg(KEIRYO.addLogDays(d,-7));
  const series=[]; for(let i=27;i>=0;i--){ const a=mealAvg(KEIRYO.addLogDays(d,-i)); if(a!=null)series.push(a); }
  const today=(bw||[]).find(x=>x.date===d);
  const raw=[...(bw||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const cur=raw[raw.length-1];

  let goalLine='';
  if(plan&&avgNow!=null){
    const g=KEIRYO.goalFromTargetBodyFat(plan.lbmKg, avgNow, +n.targetBf);
    const wk=(avgPrev!=null)?Math.round((avgNow-avgPrev)*1000)/1000:null;
    const land=(wk!=null)?KEIRYO.projectLandingDate(avgNow,g.goalWeightKg,wk,new Date()):null;
    goalLine=`<div class="m-goal">
      <div class="m-goal-r"><span>目標体重（体脂肪 ${n.targetBf}%）</span><b>${g.goalWeightKg.toFixed(1)} kg</b></div>
      <div class="m-goal-r"><span>目標まで</span><b>${g.fatToLoseKg>0?g.fatToLoseKg.toFixed(1)+' kg':'達成'}</b></div>
      <div class="m-goal-r"><span>着地予定</span><b>${land?`${land.date.getFullYear()}年${land.date.getMonth()+1}月ごろ`:(g.fatToLoseKg<=0?'—':'ペース待ち')}</b></div>
    </div>`;
  }

  let reviewLine='';
  if(plan&&avgNow!=null&&avgPrev!=null){
    const r=KEIRYO.reviewWeek({thisWeekAvgKg:avgNow, lastWeekAvgKg:avgPrev, stalledLastWeek:!!n.stalledLastWeek});
    const col={too_fast:'#c9762f', on_track:'var(--pos)', slowing:'var(--txt-2)', stalled:'#c9962f'}[r.verdict];
    const isSunday=new Date(d+'T00:00:00').getDay()===0;
    if(isSunday||r.kcalAdjustment!==0){
      reviewLine=`<div class="card"><div class="lbl">今週の判定</div>
        <div class="m-rev"><span class="m-rev-d" style="color:${col}">${r.deltaKg>0?'+':''}${r.deltaKg.toFixed(2)} kg</span>
          <span class="m-rev-t">${_me(r.message)}</span></div>
        ${r.kcalAdjustment!==0?`<button class="btn" id="mRevApply" style="width:100%;margin-top:11px">目標を ${r.kcalAdjustment>0?'+':''}${r.kcalAdjustment}kcal にする</button>
        <div class="hint" style="margin-top:9px">変えるのは炭水化物だけです。タンパク質と脂質は減らしません。</div>`:''}
        <div class="hint" style="margin-top:9px">外食の翌日は塩分と糖質で1〜1.5kg増えますが、これは水分です。7日平均が吸収します。</div>
      </div>`;
    }
  }

  return `<div class="card">
      <div class="bw-head"><div class="big">${cur?(+cur.kg).toFixed(1):'--'}<small> kg</small></div>
        ${(avgNow!=null&&avgPrev!=null)?`<span class="delta" style="color:${avgNow-avgPrev<0?'#6ad1a0':'#ff9a6a'}">${avgNow-avgPrev>0?'+':''}${(avgNow-avgPrev).toFixed(2)}kg</span>`:''}
        <span style="margin-left:auto;font-size:11px;color:var(--txt-3)">${avgNow!=null?'7日平均 '+avgNow.toFixed(2)+'kg':'記録待ち'}</span></div>
      ${series.length>1?spark(series):'<div class="spark-empty">体重を2日ぶん記録すると、7日平均の推移が出ます</div>'}
      <div class="hint" style="margin-top:8px">グラフは<b>7日平均</b>です。日々の増減は水分でぶれるので、平均だけを見て判断します。</div>
      ${goalLine}
      <div class="bw-input" style="margin-top:13px">
        <div class="field"><input id="mBwIn" type="number" inputmode="decimal" step="0.1" placeholder="今日の体重" value="${today?today.kg:''}"><span class="unit">kg</span></div>
        <button class="btn primary" style="width:auto;padding:0 18px" id="mBwSave">記録</button></div>
      <div class="bw-input" style="margin-top:8px">
        <div class="field"><input id="mBfIn" type="number" inputmode="decimal" step="0.1" placeholder="体脂肪率（任意）" value="${today&&today.bf?today.bf:(n.bfPct??'')}"><span class="unit">%</span></div>
        <label class="m-ref"><input type="checkbox" id="mRefIn"${today&&today.ref?' checked':''}><span>参考値</span></label></div>
      <div class="hint" style="margin-top:9px">条件をそろえて測るのがコツ：<b>${_me(n.cond||'起床後・トイレ後・食前・下着のみ')}</b>。
        条件から外れた日は「参考値」にすると、7日平均から外れて判断がぶれません。</div>
    </div>${reviewLine}`;
}

function bindMealChange(v, rerender){
  const d=mealLogDate();
  const bs=v.querySelector('#mBwSave');
  if(bs)bs.onclick=()=>{
    const kg=parseFloat(v.querySelector('#mBwIn').value);
    if(!(kg>0)){ toast('体重を入力してください'); return; }
    const bf=parseFloat(v.querySelector('#mBfIn').value);
    const ref=v.querySelector('#mRefIn').checked;
    const ex=bw.find(x=>x.date===d);
    const rec={date:d, kg}; if(bf>0)rec.bf=bf; if(ref)rec.ref=true;
    if(ex){ delete ex.bf; delete ex.ref; Object.assign(ex,rec); } else bw.push(rec);
    if(bf>0)nutriCfg().bfPct=bf;
    saveAll(); rerender(); toast('記録しました');
  };
  const ra=v.querySelector('#mRevApply');
  if(ra)ra.onclick=()=>{
    const plan=nutriPlan(); if(!plan)return;
    const avgNow=mealAvg(d), avgPrev=mealAvg(KEIRYO.addLogDays(d,-7));
    const r=KEIRYO.reviewWeek({thisWeekAvgKg:avgNow, lastWeekAvgKg:avgPrev, stalledLastWeek:!!nutriCfg().stalledLastWeek});
    const next=plan.kcal+r.kcalAdjustment;
    const wtest=KEIRYO.planWeek({dailyTargetKcal:next, eatOutDates:weekEatOutDates(KEIRYO.weekStart(d)), eatOutKcal:+nutriCfg().eatOutKcal});
    const s=KEIRYO.evaluateCalorieSafety(KEIRYO.weeklyAvgDailyKcal(wtest), plan.bmr);
    if(s.level==='blocked'){ toast(s.message); return; }
    nutriCfg().overrideKcal=next; nutriCfg().stalledLastWeek=(r.verdict==='stalled');
    saveAll(); rerender(); toast(`目標を ${next.toLocaleString()}kcal にしました`);
  };
}

    <div class="hint" style="margin-top:7px">いつも使うペットボトルやコップの大きさ。これで「あと何本」を数えます。</div>

}

function bindMealSettings(v, rerender){
  const list=mealPresetList();
  const sg=v.querySelector('#sSaveGoal');
  if(sg)sg.onclick=()=>{
    const c=nutriCfg();
    const bf=parseFloat(v.querySelector('#sBf').value), tbf=parseFloat(v.querySelector('#sTbf').value);
    const def=parseFloat(v.querySelector('#sDef').value);
    if(!(bf>0&&bf<70)){ toast('体脂肪率を正しく入れてください'); return; }
    if(!(tbf>0&&tbf<70)){ toast('目標の体脂肪率を正しく入れてください'); return; }
    if(tbf>bf){ toast('目標の体脂肪率が、いまの値より高くなっています'); return; }
    if(!(def>=0&&def<=1500)){ toast('1日の赤字は 0〜1500kcal で入れてください'); return; }
    c.bfPct=bf; c.targetBf=tbf; c.activity=parseFloat(v.querySelector('#sAct').value); c.deficit=def;
    const p2=nutriPlan();
    if(p2){ const w2=mealWeekPlan(p2,mealLogDate());
      const s=KEIRYO.evaluateCalorieSafety(KEIRYO.weeklyAvgDailyKcal(w2), p2.bmr);
      if(s.level==='blocked'){ toast(s.message); return; } }
    saveAll(); rerender(); toast('保存しました');
  };
  const sco=v.querySelector('#sClearOv');
  if(sco)sco.onclick=()=>{ delete nutriCfg().overrideKcal; saveAll(); rerender(); toast('自動計算に戻しました'); };

  const sw=v.querySelector('#sSaveWeek');
  if(sw)sw.onclick=()=>{
    const c=nutriCfg();
    const dow=v.querySelector('#sEod').value;
    const eok=parseFloat(v.querySelector('#sEok').value);
    const bh=parseInt(v.querySelector('#sBh').value,10);
    const bed=parseInt(v.querySelector('#sBed').value,10);
    if(!(eok>0&&eok<=8000)){ toast('外食日の想定カロリーを正しく入れてください'); return; }
    if(!(bh>=0&&bh<=12)){ toast('1日の区切りは 0〜12時で入れてください'); return; }
    if(!(bed>=0&&bed<=23)){ toast('就寝時刻は 0〜23時で入れてください'); return; }
    c.eatOutDow=(dow===''?null:+dow); c.eatOutKcal=eok; c.boundaryHour=bh; c.bedHour=bed;
    c.cond=v.querySelector('#sCond').value.trim()||'起床後・トイレ後・食前・下着のみ';
    saveAll(); rerender(); toast('保存しました');
  };

  const swat=v.querySelector('#sSaveWater');
  if(swat)swat.onclick=()=>{
    const c=nutriCfg(), dl=drinkPresetList();
    const cupv=parseFloat(v.querySelector('#sCup').value);
    if(!(cupv>=50&&cupv<=2000)){ toast('1本の大きさは 50〜2000ml で入れてください'); return; }
    c.cupMl=cupv;
    const wv=v.querySelector('#sWat').value.trim();
    if(wv===''){ delete c.waterOverride; }
    else { const w=parseFloat(wv); if(!(w>=300&&w<=8000)){ toast('目標は 300〜8000ml で入れてください'); return; } c.waterOverride=w; }
    let bad=false;
    dl.forEach((p,i)=>{
      const nm=v.querySelector('[data-dn="'+i+'"]'); if(!nm)return;
      const mlv=parseFloat(v.querySelector('[data-dml="'+i+'"]').value);
      if(!(mlv>0&&mlv<=3000)){ bad=true; return; }
      p.name=nm.value.trim()||'飲み物'; p.ml=mlv;
      p.caffeineMg=Math.max(0,parseFloat(v.querySelector('[data-dcaf="'+i+'"]').value)||0);
      p.kcal=Math.max(0,parseFloat(v.querySelector('[data-dk="'+i+'"]').value)||0);
    });
    if(bad){ toast('量は 1〜3000ml で入れてください'); return; }
    saveAll(); rerender(); toast('保存しました');
  };
  const swc=v.querySelector('#sWatClear');
  if(swc)swc.onclick=()=>{ delete nutriCfg().waterOverride; saveAll(); rerender(); toast('自動に戻しました'); };
  v.querySelectorAll('[data-ddel]').forEach(b=>{ b.onclick=()=>{ const dl=drinkPresetList();
    if(dl.length<=1){ toast('飲み物は1つ以上必要です'); return; }
    dl.splice(+b.dataset.ddel,1); saveAll(); rerender(); }; });
  const dn2=v.querySelector('#sDrNew');
  if(dn2)dn2.onclick=()=>{ drinkPresetList().push({id:'d'+Date.now(), name:'新しい飲み物', ml:200, caffeineMg:0, kcal:0}); saveAll(); rerender(); };
  const dr2=v.querySelector('#sDrReset');
  if(dr2)dr2.onclick=()=>{ drinkPresets=JSON.parse(JSON.stringify(KEIRYO.DEFAULT_DRINKS)); saveAll(); rerender(); toast('最初の飲み物に戻しました'); };

  v.querySelectorAll('[data-pen]').forEach(inp=>{ inp.onchange=()=>{ const p=list[+inp.dataset.pen];

/** ボタンの説明文を中身から作り直す。
    「100g」のようなグラム単位の食品は、×1.5 ではなく 150g と実量で出す（そのほうが読める） */
function syncPresetSummary(p){
  p.summary=p.items.map(it=>{
    try{
      const f=KEIRYO.getFood(it.foodId,myFoods), nm=f.name.replace(/（.*?）/g,'');
      if(/^\d+(\.\d+)?\s*g$/.test(String(f.unit||''))) return nm+Math.round(f.g*it.qty)+'g';
      return nm+(it.qty!==1?'×'+it.qty:'');
    }catch(e){ return ''; }
  }).filter(Boolean).join('・');
}

/* 腹の種目をそろえる。
   部位ボタンに「腹」はあったのに種目が0件で、押しても何も出ない状態だった。

   ★一度きりのフラグ方式にしていたら、起動直後に足した種目を
     クラウド同期(applyPayload)の上書きが消してしまい、
     フラグだけ残って二度と復活しない、という不具合になった。
     そのため「腹の種目が0件なら足す」を何度でも実行できる形にし、
     クラウドにも書き戻して定着させる。 */
function ensureAbsExercises(){
  let changed=false;
  // ① 種目：1つも無い時だけ既定を入れ直す（自分で消した1種目が毎回復活するのを避ける）
  if(!exercises.some(e=>e.muscle==='腹')){
    DEFAULT_EX.filter(e=>e.muscle==='腹').forEach(e=>{
      if(!exercises.some(x=>x.id===e.id)){ exercises.push(JSON.parse(JSON.stringify(e))); changed=true; }
    });
  }
  /* ② 部位ボタン（分割の日）：★種目とは独立に判定する。
        v82 は「腹の種目が既にある」と即 return していたため、
        applyTemplate('split4') が routines を 胸/背中/肩/足/腕 に作り直した後、
        腹の日だけ復活せず「部位を選ぶ」から消えたままだった。 */
  if(!routines.some(r=>RT_MUS[r.name]==='腹')){
    const ids=exercises.filter(e=>e.muscle==='腹').map(e=>e.id);   // 実在する腹の種目を紐づける
    routines.push({id:'r_abs_'+uid(), name:'腹', exIds:ids});
    changed=true;
  }
  if(changed) saveAll();      // クラウドにも入れる。入れないと毎回消され続ける
  return changed;
}

/* 端末に古い版が居座った時の脱出口。
   サービスワーカーとキャッシュを全部消してから読み直す。
   記録データ（localStorage / クラウド）には一切触らない。 */
async function forceAppUpdate(){
  toast('最新を取りに行きます…');
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      for(const r of rs){ try{ await r.unregister(); }catch(e){} }
    }
    if(window.caches){
      const ks=await caches.keys();
      for(const k of ks){ try{ await caches.delete(k); }catch(e){} }
    }
  }catch(e){}
  location.replace(location.pathname+'?u='+Date.now());
}

if('serviceWorker' in navigator){
  // 新しいバージョンが有効になったら自動で1回だけリロード（更新が確実に届く）
  let _swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_swReloaded)return; _swReloaded=true; location.reload(); });
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(reg=>{ reg.update();
    setInterval(()=>reg.update(), 60*60*1000); }).catch(()=>{}); });
}
